services:
  server:
    build: ./server
    container_name: lab2_server
    ports:
      - "3001:3001"
    volumes:
      - ./server/uploads:/app/uploads
      - ./server/data.db:/app/data.db
    restart: unless-stopped

  client:
    build: ./client
    container_name: lab2_client
    ports:
      - "8080:80"
    depends_on:
      - server
    restart: unless-stopped