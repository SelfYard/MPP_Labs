services:
  server:
    build: ./server
    image: lab3-server
    container_name: lab3_server
    environment:
      NODE_ENV: production
      PORT: 3001
      JWT_ACCESS_SECRET:  ${JWT_ACCESS_SECRET:-dev-access-secret-change-me}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-change-me}
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_FROM: noreply@books.local
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ADMIN_EMAIL:    ${ADMIN_EMAIL:-admin@books.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin12345}
    volumes:
      - ./server/uploads:/app/uploads
      - ./server/data.db:/app/data.db
    ports:
      - "3001:3001"
    depends_on:
      mailhog:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  mailhog:
    image: mailhog/mailhog
    container_name: lab3_mailhog
    ports:
      - "8025:8025"
      - "1025:1025"
    restart: unless-stopped

  client:
    build: ./client
    image: lab3-client
    container_name: lab3_client
    ports:
      - "8080:80"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped