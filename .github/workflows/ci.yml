name: Lab 3 CI

on:
  push:
    branches: [ main, master ]
    paths:
      - 'lab3/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'lab3/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

jobs:
  server:
    name: Server lint & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab3/server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lab3/server/package-lock.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: server
    defaults:
      run:
        working-directory: lab3
    steps:
      - uses: actions/checkout@v5
      - name: Build images
        run: docker compose build